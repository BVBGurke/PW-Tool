name: Deploy Website to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/pages.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: website/pnpm-lock.yaml }
      - run: pnpm --dir website install --frozen-lockfile
      - run: pnpm --dir website build
        env: { GITHUB_ACTIONS: "true" }
      - uses: actions/upload-pages-artifact@v3
        with: { path: website/dist }
      - id: deployment
        uses: actions/deploy-pages@v4
