name: Quality and Pages Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -r backend/requirements.txt
      - run: PYTHONPATH=backend python -m unittest discover -v backend/tests
  react:
    runs-on: ubuntu-latest
    strategy:
      matrix: { project: [frontend, website] }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: "${{ matrix.project }}/pnpm-lock.yaml" }
      - run: pnpm --dir ${{ matrix.project }} install --frozen-lockfile
      - run: pnpm --dir ${{ matrix.project }} build
