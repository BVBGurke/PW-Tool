[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pw-tool"
version = "0.1.0b1"
description = "Lokaler Python-CLI-Passwortgenerator für eine private technische Beta"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=8.2,<9",
]

[project.scripts]
pw-tool = "pw:main"

[tool.setuptools]
py-modules = [
    "cpu_engine",
    "cuda_engine",
    "diagnostics",
    "dispatcher",
    "hash_demo",
    "password_engine",
    "profiles",
    "pw",
    "security_check",
    "system_mix",
    "textual_ui",
    "version",
]
packages = ["backends", "benchmark"]

[tool.setuptools.package-data]
"*" = ["*.md"]
